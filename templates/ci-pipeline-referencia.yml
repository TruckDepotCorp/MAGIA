# Pipeline CI de referencia de MAGIA (v0.3.0) — GitHub Actions.
# Coherente con docs/06-stack-tecnico.md (GitHub + GitHub Actions). Copiar a
# .github/workflows/magia-gate.yml del repo y adaptar lo marcado [ADAPTAR].
#
# Regla R5: marcar el job `magia-gate` como check REQUERIDO en la protección
# de la rama principal (Settings > Branches). Sin eso, el gate es decorativo.
#
# Estado: la lógica de check.sh está probada a nivel de script; este workflow
# NO se ha corrido todavía en un repo real (pendiente del primer ciclo de uso).

name: magia-gate

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  magia-check:
    name: MAGIA check (Core, Skills, contexto)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar instalación MAGIA
        run: bash .magia/core/scripts/check.sh

  secrets:
    name: Escaneo de secretos (R6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # [ADAPTAR] Scanner de secretos de la empresa; gitleaks como ejemplo.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tests:
    name: Pruebas del repo
    runs-on: ubuntu-latest   # [ADAPTAR] windows-latest si el build lo exige (.NET Framework)
    steps:
      - uses: actions/checkout@v4
      # [ADAPTAR] setup del stack y comando de commands.test de magia.config.json.
      - name: Pruebas
        run: echo "TODO - [ADAPTAR] ejecutar el comando de pruebas del repo"

  evals:
    name: Evals de IA (solo si aiInProduct=true)
    runs-on: ubuntu-latest
    needs: [magia-check]
    steps:
      - uses: actions/checkout@v4
      - name: Evals contra el golden set
        run: |
          if grep -q '"aiInProduct"[[:space:]]*:[[:space:]]*true' magia.config.json; then
            echo "TODO - [ADAPTAR] ejecutar commands.eval; fallar ante regresión o bajo umbral"
            # Las llaves de proveedor se inyectan desde secrets del vault corporativo (R6), nunca en el repo.
          else
            echo "aiInProduct=false: sin evals de producto."
          fi

  magia-gate:
    name: magia-gate (requerido para merge)
    runs-on: ubuntu-latest
    needs: [magia-check, secrets, tests, evals]
    steps:
      - run: echo "Gate en verde. La aprobación humana del PR (Paquete de Evidencia) sigue siendo obligatoria."
